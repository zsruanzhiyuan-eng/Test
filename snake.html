<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #eee;
  }
  h1 { font-size: 2rem; margin-bottom: 8px; color: #4ecca3; letter-spacing: 4px; }
  #info {
    display: flex;
    gap: 40px;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }
  #info span { color: #4ecca3; font-weight: bold; }
  canvas {
    border: 3px solid #4ecca3;
    border-radius: 4px;
    box-shadow: 0 0 30px #4ecca388;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #overlay h2 { font-size: 2rem; color: #ff6b6b; letter-spacing: 2px; }
  #overlay p { font-size: 1rem; color: #aaa; }
  button {
    margin-top: 8px;
    padding: 10px 28px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 2px;
    transition: background 0.2s;
  }
  button:hover { background: #38b2ac; }
  #hint { margin-top: 10px; font-size: 0.8rem; color: #555; }
</style>
</head>
<body>
<h1>SNAKE</h1>
<div id="info">
  <div>SCORE: <span id="score">0</span></div>
  <div>BEST: <span id="best">0</span></div>
  <div>LEVEL: <span id="level">1</span></div>
</div>
<div style="position:relative">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">SNAKE</h2>
    <p id="overlay-msg">Use arrow keys or WASD to move</p>
    <button id="btn">PLAY</button>
    <p id="hint">Eat food to grow. Don't hit walls or yourself!</p>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const levelEl = document.getElementById('level');
const btn = document.getElementById('btn');
const overlayTitle = document.getElementById('overlay-title');
const overlayMsg = document.getElementById('overlay-msg');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, best, level, speed, loop, running, particles;

best = parseInt(localStorage.getItem('snakeBest') || '0');
bestEl.textContent = best;

function randInt(max) { return Math.floor(Math.random() * max); }

function spawnFood(snakeBody) {
  let pos;
  do {
    pos = { x: randInt(COLS), y: randInt(ROWS) };
  } while (snakeBody.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}

function init() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 },
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  level = 1;
  speed = 150;
  particles = [];
  food = spawnFood(snake);
  scoreEl.textContent = 0;
  levelEl.textContent = 1;
}

function spawnParticles(x, y) {
  const colors = ['#4ecca3', '#ffd700', '#ff6b6b', '#a29bfe'];
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: x * GRID + GRID / 2,
      y: y * GRID + GRID / 2,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      life: 1,
      color: colors[randInt(colors.length)],
      r: Math.random() * 3 + 1,
    });
  }
}

function update() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10 * level;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snakeBest', best); }
    spawnParticles(food.x, food.y);
    food = spawnFood(snake);
    // Level up every 5 foods
    if (snake.length % 5 === 0) {
      level = Math.min(level + 1, 10);
      levelEl.textContent = level;
      speed = Math.max(60, 150 - (level - 1) * 12);
      clearInterval(loop);
      loop = setInterval(tick, speed);
    }
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid dots
  ctx.fillStyle = '#1a2a4a';
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
    ctx.beginPath();
    ctx.arc(x * GRID + GRID / 2, y * GRID + GRID / 2, 1, 0, Math.PI * 2);
    ctx.fill();
  }

  // Food with glow
  const fx = food.x * GRID, fy = food.y * GRID;
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
  ctx.save();
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur = 15 * pulse;
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(fx + GRID / 2, fy + GRID / 2, (GRID / 2 - 2) * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Snake
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    const g = Math.floor(204 - t * 80);
    ctx.fillStyle = i === 0 ? '#4ecca3' : `rgb(30, ${g}, 120)`;
    ctx.shadowColor = i === 0 ? '#4ecca3' : 'transparent';
    ctx.shadowBlur = i === 0 ? 10 : 0;
    const pad = i === 0 ? 1 : 2;
    ctx.beginPath();
    ctx.roundRect(seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad * 2, GRID - pad * 2, i === 0 ? 5 : 3);
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Eyes on head
  const h = snake[0];
  const ex = dir.x === 0 ? [5, 13] : dir.x > 0 ? [13, 13] : [5, 5];
  const ey = dir.y === 0 ? [5, 13] : dir.y > 0 ? [13, 13] : [5, 5];
  const eyeY = dir.y !== 0 ? (dir.y > 0 ? [13, 13] : [5, 5]) : [5, 13];
  const eyeX = dir.x !== 0 ? (dir.x > 0 ? [13, 13] : [5, 5]) : [5, 13];
  ctx.fillStyle = '#1a1a2e';
  [[eyeX[0], eyeY[0]], [eyeX[1], eyeY[1]]].forEach(([ox, oy]) => {
    ctx.beginPath();
    ctx.arc(h.x * GRID + ox, h.y * GRID + oy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    p.x += p.vx; p.y += p.vy; p.life -= 0.05;
  });
  ctx.globalAlpha = 1;
}

function tick() { update(); draw(); }

function gameOver() {
  clearInterval(loop);
  running = false;
  overlayTitle.textContent = 'GAME OVER';
  overlayTitle.style.color = '#ff6b6b';
  overlayMsg.textContent = `Score: ${score}  •  Best: ${best}`;
  btn.textContent = 'RETRY';
  document.getElementById('hint').textContent = '';
  overlay.style.display = 'flex';
}

function startGame() {
  overlay.style.display = 'none';
  init();
  running = true;
  clearInterval(loop);
  loop = setInterval(tick, speed);
}

btn.addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
  };
  const nd = map[e.key];
  if (nd && running) {
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
    e.preventDefault();
  }
  if ((e.key === ' ' || e.key === 'Enter') && !running) startGame();
});

// Touch support
let touchStart = null;
canvas.addEventListener('touchstart', e => { touchStart = e.touches[0]; e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', e => {
  if (!touchStart || !running) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  if (Math.abs(dx) > Math.abs(dy)) {
    nextDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
  } else {
    nextDir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
  }
  if (nextDir.x === -dir.x && nextDir.y === -dir.y) nextDir = dir;
  e.preventDefault();
}, { passive: false });

// Draw initial frame
init();
draw();
</script>
</body>
</html>
